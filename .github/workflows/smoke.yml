name: Smoke

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.version.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  smoke:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/camilbenameur/saucedemo-e2e:${{ needs.version.outputs.playwright }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test --grep @smoke --project=chromium
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-smoke
          path: |
            playwright-report/
            test-results/junit.xml
