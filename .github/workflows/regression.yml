name: Régression

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Filtre sur les étiquettes (vide = @regression)'
        required: false
        default: ''

permissions:
  contents: read
  packages: read

jobs:
  disponibilite:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.version.outputs.playwright }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - run: curl --fail --silent --show-error --max-time 30 -o /dev/null -w '%{http_code}\n' "${BASE_URL:-https://www.saucedemo.com}/"

  regression:
    needs: disponibilite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/camilbenameur/saucedemo-e2e:${{ needs.disponibilite.outputs.playwright }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    env:
      HOME: /root
      GREP: ${{ inputs.grep || '@regression' }}
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - run: npx playwright test --grep "$GREP" --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: rapport-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/junit.xml
