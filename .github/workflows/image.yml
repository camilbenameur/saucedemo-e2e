name: Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - playwright.config.ts
      - 'tests/**'
      - 'scripts/**'
      - .github/workflows/image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/camilbenameur/saucedemo-e2e

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "playwright=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: >
          docker build
          --build-arg PLAYWRIGHT_VERSION=${{ steps.version.outputs.playwright }}
          -t "$IMAGE:${{ steps.version.outputs.playwright }}"
          -t "$IMAGE:sha-${GITHUB_SHA::7}"
          .
      - run: docker push --all-tags "$IMAGE"
